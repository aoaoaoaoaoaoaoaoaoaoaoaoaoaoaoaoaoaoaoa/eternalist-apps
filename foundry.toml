schema = 1

[product]
name = "eternalist-apps"
package = "eternalist-apps"
profile = "rust-library"

[coordinates]
release-tested = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]

[[proofs]]
name = "source"
laws = ["source", "demonstration"]
run = ["scripts/check-foundry"]
timeout-minutes = 60

[[proofs]]
name = "host"
laws = ["host"]
coordinates = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]
timeout-minutes = 45

[[proofs]]
name = "crash-path-native"
laws = ["host"]
run = [
  "cargo",
  "run",
  "--locked",
  "--example",
  "crash_native_acceptance",
  "--features",
  "egui-test",
  "--",
  "https://faults.eternalist.moe/v1/report",
]
coordinates = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]
timeout-minutes = 15

[[proofs]]
name = "clipboard-acceptance"
laws = ["native-acceptance"]
run = [
  "cargo",
  "run",
  "--locked",
  "--release",
  "--example",
  "clipboard_acceptance",
  "--features",
  "egui-test",
]
coordinates = ["linux-x86_64"]
setup = "x11"
timeout-minutes = 15

[[proofs]]
name = "native-acceptance"
laws = ["native-acceptance"]
run = ["scripts/test-atelier"]
coordinates = ["linux-x86_64"]
setup = "x11"
timeout-minutes = 30
