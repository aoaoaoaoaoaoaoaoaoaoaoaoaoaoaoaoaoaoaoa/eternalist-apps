schema = 1

[product]
name = "eternalist-apps"
package = "eternalist-apps"
profile = "rust-library"

[coordinates]
release-tested = [
  "linux-x86_64",
  "macos-aarch64",
  "macos-x86_64",
  "windows-x86_64",
]

[[proofs]]
name = "source"
laws = ["source"]
run = ["scripts/check-foundry"]
setup = "wayland"
timeout-minutes = 60

[[proofs]]
name = "security"
laws = ["security"]
run = ["scripts/audit"]
timeout-minutes = 15

[[proofs]]
name = "source-package"
laws = ["source-package"]
run = ["cargo", "package", "--locked"]
setup = "wayland"
timeout-minutes = 30

[[proofs]]
name = "host-linux"
laws = ["host"]
run = ["cargo", "test", "--locked", "--all-targets", "--all-features"]
coordinates = ["linux-x86_64"]
setup = "wayland"
timeout-minutes = 45

[[proofs]]
name = "host"
laws = ["host"]
run = ["cargo", "test", "--locked", "--all-targets", "--all-features"]
coordinates = ["macos-aarch64", "macos-x86_64", "windows-x86_64"]
timeout-minutes = 45

[[proofs]]
name = "native-acceptance"
laws = ["native-acceptance"]
run = ["scripts/test-atelier"]
coordinates = ["linux-x86_64"]
setup = "x11"
timeout-minutes = 30
