<!doctype html>
<html lang="en" data-eternalist="booting">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0b09">
    <meta name="description" content="Interactive Eternalist application primitive atelier.">
    <link rel="canonical" href="https://eternalist.moe/demos/eternalist-apps/">
    <link rel="icon" href="./atelier.svg" type="image/svg+xml">
    <title>Eternalist · application primitive atelier</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c0b09;
      }

      #eternalist {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #status {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        place-items: center;
        color: #a98556;
        background: #0c0b09;
        font: 12px/1.5 ui-monospace, monospace;
        letter-spacing: 0.12em;
        transition: opacity 180ms ease;
        pointer-events: none;
      }

      html[data-eternalist="ready"] #status {
        opacity: 0;
      }

      html[data-eternalist="failed"] #status {
        color: #d29a72;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="eternalist" aria-label="Interactive Eternalist application primitive atelier"></canvas>
    <div id="status" role="status">RAISING WEBGPU ATELIER</div>
    <noscript>This atelier requires JavaScript and WebGPU.</noscript>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
