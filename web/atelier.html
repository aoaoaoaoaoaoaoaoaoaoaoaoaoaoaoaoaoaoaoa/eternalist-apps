<!doctype html>
<html lang="en" data-eternalist="booting">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0b09">
    <link rel="icon" href="./atelier.svg" type="image/svg+xml">
    <title>Eternalist · application primitive atelier</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c0b09;
      }

      #eternalist {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #a98556;
        background: #0c0b09;
        font: 12px/1.5 ui-monospace, monospace;
        letter-spacing: 0.12em;
        transition: opacity 180ms ease;
        pointer-events: none;
      }

      html[data-eternalist="ready"] #status {
        opacity: 0;
      }

      html[data-eternalist="failed"] #status {
        color: #d29a72;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="eternalist" aria-label="Interactive Eternalist application primitive atelier"></canvas>
    <div id="status" role="status">RAISING WEBGPU ATELIER</div>
    <noscript>This atelier requires JavaScript and WebGPU.</noscript>
    <script type="module">
      import init from "./eternalist.js";

      const root = document.documentElement;
      const status = document.getElementById("status");
      const fail = error => {
        const message = error instanceof Error ? error.message : String(error);
        root.dataset.eternalist = "failed";
        status.textContent = "WEBGPU ATELIER FAILED · " + message;
        console.error(error);
      };

      try {
        if (!window.isSecureContext) {
          throw new Error("serve this directory over HTTPS or localhost");
        }
        if (!navigator.gpu) {
          throw new Error("this browser does not expose WebGPU");
        }
        const adapter = await navigator.gpu.requestAdapter({
          powerPreference: "high-performance",
        });
        if (!adapter) {
          throw new Error(
            "no usable WebGPU adapter; enable graphics acceleration. " +
            "In Linux Chromium, also enable chrome://flags/#enable-unsafe-webgpu " +
            "and chrome://flags/#enable-vulkan, then relaunch the browser",
          );
        }
        const info = adapter.info ?? {};
        const identity = [
          info.vendor,
          info.architecture,
          info.device,
          info.description,
          info.backend,
          info.type,
        ].filter(Boolean).join(" ").toLowerCase();
        const software = ["swiftshader", "llvmpipe", "lavapipe", "software", "cpu"]
          .find(marker => identity.includes(marker));
        root.dataset.webgpuAdapter = identity || "undisclosed";
        console.info("Eternalist WebGPU adapter", info);
        if (software) {
          throw new Error(
            `WebGPU selected a software adapter (${identity}); enable ` +
            "chrome://flags/#enable-vulkan, relaunch Chromium, and verify " +
            "chrome://gpu reports WebGPU as hardware accelerated",
          );
        }
        await init();
        window.setTimeout(() => {
          if (root.dataset.eternalist === "booting") {
            fail(new Error("the first rendered frame did not arrive"));
          }
        }, 15_000);
      } catch (error) {
        fail(error);
      }
    </script>
  </body>
</html>
