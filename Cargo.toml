[package]
name = "eternalist-apps"
version = "0.7.10"
description = "Native egui lifecycle and reusable high-level application primitives."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/eternalist-apps"
rust-version = "1.96"
keywords = ["egui", "wgpu", "winit", "desktop"]
categories = ["gui"]
exclude = ["vendor/**"]

[package.metadata.docs.rs]
all-features = true

[features]
egui-test = [
  "dep:egui-tester-witness",
  "serde",
  "brass_poolrooms/instrumentation",
]
serde = ["dep:serde"]

[dependencies]
brass_poolrooms = "0.13.8"
egui = "=0.36.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
egui-wgpu = { version = "=0.36.1", default-features = false }
egui-winit = { version = "=0.36.1", default-features = false, features = ["clipboard"] }
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = { version = "0.10.9", default-features = false }
tracing = "0.1.44"
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
ureq = { version = "3.4.0", default-features = false, features = ["native-tls"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
egui-winit = { version = "=0.36.1", default-features = false, features = ["wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "x11"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "vulkan", "wgsl"] }
x11rb = { version = "0.14.0", default-features = false, features = ["render"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
arboard = { version = "3.6.1", default-features = false }
egui-tester = "0.9.6"

[target.'cfg(target_os = "macos")'.dependencies]
egui-wgpu = { version = "=0.36.1", default-features = false, features = ["macos-window-resize-jitter-fix"] }
wgpu = { version = "30.0.0", default-features = false, features = ["metal", "std", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["dx12", "std", "wgsl"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies.egui-tester-witness]
version = "0.9.6"
optional = true
features = ["egui"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
anyhow = "1.0.104"
console_error_panic_hook = "0.1.7"
egui-winit-wasm = { package = "egui-winit", path = "vendor/egui-winit-0.36.1", default-features = false }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-time = "1.1.0"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "webgpu", "wgsl"] }
web-sys = { version = "=0.3.104", features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Node",
  "Window",
  "console",
] }

[lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -3 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

[package.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = ["cargo", "clippy", "--all-targets", "--all-features"]
test_command = ["cargo", "test", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--all-features", "--no-deps"]
web_command = ["scripts/web-atelier", "check"]
canonicalize_commands = [
  ["cargo", "fix", "--all-targets", "--all-features", "--allow-dirty", "--allow-staged", "--allow-no-vcs"],
  ["cargo", "clippy", "--fix", "--all-targets", "--all-features", "--allow-dirty", "--allow-staged", "--allow-no-vcs"],
  ["cargo", "fmt", "--all"],
]

[package.metadata.rust-starter.source_files]
max_lines = 3000
include = ["*.rs", "**/*.rs"]
exclude = []
